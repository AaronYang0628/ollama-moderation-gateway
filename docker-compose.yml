services:
  gateway:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      # Cloud default — override in .env for self-hosted
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com}
      OLLAMA_API_KEYS: ${OLLAMA_API_KEYS:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      MODERATION_API_KEY: ${MODERATION_API_KEY:-change-me}
      APP_ENV: ${APP_ENV:-production}
      POLICY_PATH: configs/policy.yaml
    volumes:
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Optional: self-hosted Ollama on the same Compose network.
  # Uncomment and set OLLAMA_BASE_URL=http://ollama:11434 (no API key needed).
  # ollama:
  #   image: ollama/ollama:latest
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   ports:
  #     - "11434:11434"


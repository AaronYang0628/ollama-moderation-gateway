{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ollama-moderation-gateway.secretName" . }}
  labels:
    {{- include "ollama-moderation-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.stringData }}
  {{ $key }}: {{ printf "%v" $value | quote }}
  {{- end }}
{{- end }}
